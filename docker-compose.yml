version: '3.8'
services:
 postgres:
    image: postgres:13
    container_name: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

 backend:
    image: hqdu/tapbackend:latest
    container_name: app1-backend
    restart: always
    ports:
      - "3003:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - app-network    

volumes:
  postgres_data:
networks:
  app-network:
    driver: bridge
